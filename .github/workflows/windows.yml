name: windows-ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 4
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure --output-junit "${{ github.workspace }}/build/ctest-results.xml"
      - name: Save test results and demo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.configuration }}-results
          path: |
            build/ctest-results.xml
            build/Testing/Temporary/LastTest.log
            build/sample_runtime/${{ matrix.configuration }}/out/
